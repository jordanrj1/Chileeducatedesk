{% load territorio_extras fche %}<ul class="fche-items">{% for a in actividades %}<li><div class="fche-items__texto"><a class="fche-items__titulo" href="{{ a.get_absolute_url }}">{{ a.nombre }}</a>{% if a.tipo %} <span class="small text-muted">{{ a.tipo }}</span>{% endif %}
  <div class="fche-items__detalle">{% relacion_territorial a comuna_ficha sectores_ficha %}</div></div>{% estado a.estado %}</li>{% empty %}<li class="text-muted">Aún no hay actividades aquí.</li>{% endfor %}</ul>
