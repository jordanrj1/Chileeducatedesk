<ul class="list-group">{% for l in lugares %}<li class="list-group-item"><a href="{{ l.get_absolute_url }}">{{ l.nombre }}</a> <span class="small text-muted">{{ l.tipo }}{% if l.direccion.sector %} · {{ l.direccion.sector }}{% endif %}{% if l.capacidad %} · capacidad {{ l.capacidad }}{% endif %}</span></li>{% empty %}<li class="list-group-item text-muted">No hay lugares registrados aquí.</li>{% endfor %}</ul>
