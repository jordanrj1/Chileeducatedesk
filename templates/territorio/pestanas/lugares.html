<ul class="fche-items">{% for l in lugares %}<li><div class="fche-items__texto"><a class="fche-items__titulo" href="{{ l.get_absolute_url }}">{{ l.nombre }}</a> <div class="fche-items__detalle">{{ l.tipo }}{% if l.direccion.sector %} · {{ l.direccion.sector }}{% endif %}{% if l.capacidad %} · capacidad {{ l.capacidad }}{% endif %}</div></div></li>{% empty %}<li class="text-muted">No hay lugares registrados aquí.</li>{% endfor %}</ul>
