<ul class="list-group">{% for o in organizaciones %}<li class="list-group-item"><a href="{{ o.get_absolute_url }}">{{ o.nombre }}</a> <span class="small text-muted">{{ o.tipo }}</span></li>{% empty %}<li class="list-group-item text-muted">No hay organizaciones registradas aquí.</li>{% endfor %}</ul>
