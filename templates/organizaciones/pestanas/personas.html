{% include "generico/_hijos.html" %}
{% if hay_autoridades and perms.personas.change_personaorganizacion %}
<form method="post" action="{% url 'organizaciones:cerrar_autoridades' object.pk %}" class="d-flex flex-wrap gap-2 align-items-end mt-4 p-3 rounded-3 border bg-light-subtle">{% csrf_token %}
  <div><label class="form-label small mb-1" for="hasta">Cambio de administración: cerrar los cargos de autoridad vigentes al</label>
  <input class="form-control form-control-sm" type="date" id="hasta" name="hasta" required></div>
  <button class="btn btn-outline-warning btn-sm" onclick="return confirm('¿Cerrar todos los cargos de autoridad vigentes? Quedan en el historial.')">Cerrar cargos de autoridad</button>
</form>
{% endif %}
